<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đề Cương HĐTN 7 - Lớp 7A7</title>
<style>
  /* Giao diện Dark Mode giống ảnh của bạn */
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1a1e1c; color: #e0e0e0; margin: 0; padding: 20px; line-height: 1.5; }
  .container { max-width: 800px; margin: 0 auto; background: #232724; padding: 30px; border-radius: 8px; border-top: 10px solid #4CAF50; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  h1 { text-align: center; color: #4CAF50; margin-bottom: 5px;}
  .header-info { text-align: center; font-size: 1.1em; margin-bottom: 30px; font-weight: bold; color: #ffffff; }
  select, button { width: 100%; padding: 12px; margin-top: 8px; font-size: 16px; border-radius: 5px; box-sizing: border-box; }
  select { background-color: #2c312e; color: #fff; border: 1px solid #4CAF50; cursor: pointer; font-weight: bold; }
  .question-box { margin-bottom: 25px; padding: 20px; border: 1px solid #3a403d; border-radius: 8px; background: #2a2f2c; }
  .question-title { font-weight: bold; margin-bottom: 15px; color: #4CAF50; font-size: 1.1em;}
  .options label { display: block; margin-bottom: 10px; cursor: pointer; padding: 10px; border-radius: 5px; transition: 0.2s; background: #333835; }
  .options label:hover { background-color: #3e4441; }
  input[type="radio"] { margin-right: 10px; transform: scale(1.2); accent-color: #4CAF50; }
  button { background-color: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; padding: 15px; font-size: 18px;}
  button:hover { background-color: #45a049; }
  #resultBox { display: none; margin-top: 30px; padding: 20px; border-radius: 8px; font-size: 18px; line-height: 1.6; background-color: #2c312e; border: 1px solid #4CAF50;}
  .feedback { margin-top: 15px; padding: 10px; border-radius: 5px; font-size: 0.95em; }
</style>
</head>
<body>
<div class="container">
  <h1>ĐỀ CƯƠNG HOẠT ĐỘNG TRẢI NGHIỆM 7</h1>
  <div class="header-info">Lớp 7A7 - Năm học 2026-2027<br><span style="font-size: 0.9em; font-weight: normal;">(25 Câu Trắc nghiệm)</span></div>
  
  <div class="question-box">
    <label style="font-weight: bold; color: #fff;">Chọn tên của bạn:</label>
    <select id="studentName">
      <option value="">-- Bấm vào đây để chọn tên --</option>
    </select>
  </div>

  <div id="quizContainer"></div>

  <button onclick="nopBai()">NỘP BÀI & XEM ĐIỂM</button>
  <div id="resultBox"></div>
</div>

<script>
  // Danh sách 39 học sinh lớp 7A7
  const danhsach7A7 = [
    "1. Phạm Thị Vân Anh", "2. Phạm Hoài Bảo", "3. Trần Phạm Gia Bảo", "4. Nguyễn Ngọc Diễm", 
    "5. Huỳnh Vũ Duy", "6. Võ Minh Duy", "7. Đỗ Lâm Hạnh Duyên", "8. Nguyễn Phan Khánh Duyên", 
    "9. Nguyễn Minh Đăng", "10. Võ Nguyễn Ngọc Giàu", "11. Võ Thị Nhã Hân", "12. Võ Minh Hiếu", 
    "13. Nguyễn Hoàng Kha", "14. Phan Hoàng Thái Lâm", "15. Nguyễn Hữu Bảo Long", "16. Huỳnh Duy Mạnh", 
    "17. Lê Thị Cẩm Mi", "18. Nguyễn Lâm Hải Nam", "19. Phạm Hoàng Phương Nghi", "20. Nguyễn Phương Khánh Ngọc", 
    "21. Nguyễn Trần Bảo Ngọc", "22. Trần Nguyễn Như Ngọc", "23. Lê Nhi", "24. Phạm Đỗ Huỳnh Như", 
    "25. Võ Minh Nhựt", "26. Lê Văn Hoàng Phi", "27. Ngô Văn Tài", "28. Lê Thanh Tân", 
    "29. Đỗ Huệ Thanh", "30. Phạm Huỳnh Thanh Thảo", "31. Nguyễn Trúc Thi", "32. Trần Hoàng Thiện", 
    "33. Huỳnh Anh Thư", "34. Trần Trung Tín", "35. Nguyễn Thị Ngọc Trân", "36. Nguyễn Minh Triệu", 
    "37. Phạm Thanh Vũ", "38. Lê Trần Hoàng Vy", "39. Đặng Ngọc Như Ý"
  ];

  const select = document.getElementById('studentName');
  danhsach7A7.forEach(ten => {
    let opt = document.createElement('option');
    opt.value = ten; opt.innerHTML = ten;
    select.appendChild(opt);
  });

  // Mảng 25 câu hỏi (ĐÃ CÀI SẴN CHUẨN ĐÁP ÁN 1C, 2A, 3B, 4A, 5B...)
  // GHI CHÚ: Đáp án A = 0, B = 1, C = 2, D = 3
  // LƯU Ý QUAN TRỌNG: Không được vô tình xóa mất dấu ngoặc kép " hoặc dấu phẩy , khi thay chữ.
  
  const trắcnghiệm = [
    { q: "Câu 1. Nếu bạn Hà trên lớp nhút nhát và rụt rè, em sẽ làm gì để bạn tự tin hơn?", o: ["A. Chê bai bạn", "B. Lôi kéo người khác trêu bạn", "C. Tâm sự, gần gũi và rủ bạn tham gia hoạt động chung", "D. Mặc kệ bạn"], a: 2 }, // Đáp án C
    { q: "Câu 2. Để rèn luyện sự tự tin trong học tập, chúng ta cần làm gì?", o: ["A. Trên lớp tích cực quan sát, lắng nghe, học hỏi", "B. Chỉ học thuộc lòng", "C. Mượn bài bạn chép", "D. Ngồi cạnh bạn giỏi để nhìn bài"], a: 0 }, // Đáp án A
    { q: "Câu 3. Khi gặp chuyện buồn, cách giải quyết tốt nhất là:", o: ["A. Giấu kín không ai biết", "B. Mạnh dạn chia sẻ với bạn bè, người thân", "C. Chịu đựng một mình", "D. Rủ bạn chơi game"], a: 1 }, // Đáp án B
    
    // Từ câu 4 đến 25, bạn tự copy nội dung đề của bạn vào thay cho các chữ "Nhập đáp án A/B/C/D" nhé!
    { q: "Câu 4. [Ghi nội dung câu hỏi 4 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 0 }, // Đáp án A
    { q: "Câu 5. [Ghi nội dung câu hỏi 5 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 1 }, // Đáp án B
    { q: "Câu 6. [Ghi nội dung câu hỏi 6 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 2 }, // Đáp án C
    { q: "Câu 7. [Ghi nội dung câu hỏi 7 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 0 }, // Đáp án A
    { q: "Câu 8. [Ghi nội dung câu hỏi 8 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 2 }, // Đáp án C
    { q: "Câu 9. [Ghi nội dung câu hỏi 9 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 1 }, // Đáp án B
    { q: "Câu 10. [Ghi nội dung câu hỏi 10 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 3 }, // Đáp án D
    { q: "Câu 11. [Ghi nội dung câu hỏi 11 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 3 }, // Đáp án D
    { q: "Câu 12. [Ghi nội dung câu hỏi 12 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 0 }, // Đáp án A
    { q: "Câu 13. [Ghi nội dung câu hỏi 13 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 3 }, // Đáp án D
    { q: "Câu 14. [Ghi nội dung câu hỏi 14 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 1 }, // Đáp án B
    { q: "Câu 15. [Ghi nội dung câu hỏi 15 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 3 }, // Đáp án D
    { q: "Câu 16. [Ghi nội dung câu hỏi 16 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 3 }, // Đáp án D
    { q: "Câu 17. [Ghi nội dung câu hỏi 17 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 1 }, // Đáp án B
    { q: "Câu 18. [Ghi nội dung câu hỏi 18 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 2 }, // Đáp án C
    { q: "Câu 19. [Ghi nội dung câu hỏi 19 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 3 }, // Đáp án D
    { q: "Câu 20. [Ghi nội dung câu hỏi 20 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 0 }, // Đáp án A
    { q: "Câu 21. [Ghi nội dung câu hỏi 21 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 0 }, // Đáp án A
    { q: "Câu 22. [Ghi nội dung câu hỏi 22 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 1 }, // Đáp án B
    { q: "Câu 23. [Ghi nội dung câu hỏi 23 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 0 }, // Đáp án A
    { q: "Câu 24. [Ghi nội dung câu hỏi 24 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 2 }, // Đáp án C
    { q: "Câu 25. [Ghi nội dung câu hỏi 25 vào đây]", o: ["A. [Nhập đáp án A]", "B. [Nhập đáp án B]", "C. [Nhập đáp án C]", "D. [Nhập đáp án D]"], a: 3 }  // Đáp án D
  ];

  const container = document.getElementById('quizContainer');
  let html = ``;
  
  trắcnghiệm.forEach((item, index) => {
    html += `<div class="question-box" id="tn_box_${index}">
               <div class="question-title">${item.q}</div>
               <div class="options">`;
    item.o.forEach((opt, optIndex) => {
      html += `<label><input type="radio" name="tn_${index}" value="${optIndex}"> ${opt}</label>`;
    });
    html += `</div><div id="tn_fb_${index}" class="feedback"></div></div>`;
  });

  container.innerHTML = html;

  function nopBai() {
    const ten = document.getElementById('studentName').value;
    if(!ten) {
      alert("Vui lòng chọn tên của bạn ở đầu trang trước khi nộp bài!");
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    let diemTN = 0;
    let chualam = 0;

    // Chấm điểm 25 câu trắc nghiệm (0.4 điểm / câu để tổng là 10 điểm)
    trắcnghiệm.forEach((item, index) => {
      const selected = document.querySelector(`input[name="tn_${index}"]:checked`);
      const fb = document.getElementById(`tn_fb_${index}`);
      
      if(!selected) {
          chualam++;
          fb.innerHTML = `⚠️ Bạn chưa làm câu này! Đáp án đúng là: <b>${item.o[item.a]}</b>`;
          fb.style.backgroundColor = '#4a3b10'; fb.style.color = '#ffd54f';
      }
      else if(parseInt(selected.value) === item.a) {
        diemTN += 0.4;
        fb.innerHTML = `✔️ Chính xác! Đáp án đúng: ${item.o[item.a]}`;
        fb.style.backgroundColor = '#1e3823'; fb.style.color = '#81c784';
      } else {
        fb.innerHTML = `❌ Sai rồi! Đáp án đúng là: <b>${item.o[item.a]}</b>`;
        fb.style.backgroundColor = '#451c1c'; fb.style.color = '#e57373';
      }
    });

    let tongDiem = diemTN.toFixed(1); // Làm tròn 1 chữ số thập phân
    let rank = tongDiem >= 8 ? "Tuyệt vời!" : (tongDiem >= 5 ? "Khá tốt, cố gắng thêm nhé!" : "Cần ôn tập kĩ hơn nha!");

    const res = document.getElementById('resultBox');
    res.style.display = 'block';
    if(tongDiem >= 5) { res.style.borderColor = '#4CAF50'; res.style.color = '#e0e0e0'; }
    else { res.style.borderColor = '#e57373'; res.style.color = '#e0e0e0'; }

    let msg = `<h2>KẾT QUẢ BÀI LÀM</h2>
                     <b>Học sinh:</b> ${ten} <br>
                     <h3 style="margin: 10px 0; color: #4CAF50;">Tổng điểm: ${tongDiem}/10</h3>
                     <p>${rank}</p>`;
    if(chualam > 0) {
        msg += `<p style="color:#ffd54f"><i>Lưu ý: Bạn đã bỏ trống ${chualam} câu không chọn đáp án.</i></p>`;
    }
    res.innerHTML = msg;
    
    // Cuộn xuống kết quả
    res.scrollIntoView({behavior: "smooth"});
  }
</script>
</body>
</html>
